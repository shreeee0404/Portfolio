<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shreenithy R S | Software Developer & AI</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet">

  <!-- Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* =====================================================
       NAVBAR
    ===================================================== */

    .navbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 20;

      background: rgba(0, 0, 0, 0.45) !important;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      padding: 20px 0;
    }

    .navbar-brand {
      color: #fff !important;

      font-size: 1.25rem;
      font-weight: 600;

      letter-spacing: 1px;

      text-decoration: none;
    }

    .nav-link {
      color: #fff !important;

      margin-left: 24px;

      font-size: 0.95rem;
      font-weight: 400;

      transition: all 0.3s ease;
    }

    .nav-link:hover {
      color: #bdbdbd !important;

      transform: translateY(-1px);
    }

    .navbar-toggler {
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .navbar-toggler:focus {
      box-shadow: none;
    }

    .navbar-toggler-icon {
      filter: invert(1);
    }

    /* =====================================================
       HERO SECTION
    ===================================================== */

    .hero {
      position: relative;

      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;

      overflow: hidden;

      background: #000;
    }

    /* =====================================================
       LIVE VIDEO BACKGROUND
    ===================================================== */

    .hero-video {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 0;
    }

    /* =====================================================
       DARK OVERLAY
    ===================================================== */

    .hero::before {
      content: "";

      position: absolute;

      inset: 0;

      background: rgba(0, 0, 0, 0.70);

      z-index: 1;
    }

    /* =====================================================
       HERO CONTENT
    ===================================================== */

    .hero-content {
      position: relative;

      z-index: 5;

      margin-left: 9%;

      max-width: 900px;

      padding-top: 60px;
    }

    /* HELLO */

    .hello {
      font-size: 1.4rem;

      font-weight: 300;

      color: #fff;

      margin-bottom: 10px;

      letter-spacing: 1px;
    }

    /* NAME */

    .hero-title {
      font-size: clamp(3.5rem, 8vw, 7rem);

      font-weight: 700;

      line-height: 1.05;

      color: #fff;

      margin-bottom: 20px;

      letter-spacing: -2px;
    }

    /* ROLE */

    .hero-subtitle {
      font-size: 1.5rem;

      font-weight: 400;

      color: #dcdcdc;

      margin-bottom: 35px;

      letter-spacing: 1px;
    }

    /* =====================================================
       BUTTONS
    ===================================================== */

    .btn-custom {
      display: inline-block;

      padding: 12px 28px;

      border: 1px solid #fff;

      border-radius: 30px;

      color: #fff;

      text-decoration: none;

      font-size: 0.95rem;

      font-weight: 400;

      transition: all 0.3s ease;

      margin-right: 10px;
    }

    .btn-custom:hover {
      background: #fff;

      color: #000;

      transform: translateY(-3px);
    }

    /* =====================================================
       SOCIAL LINKS
    ===================================================== */

    .social-links {
      display: flex;

      align-items: center;

      gap: 18px;

      margin-top: 30px;
    }

    .social-links a {
      width: 45px;
      height: 45px;

      border: 1px solid rgba(255, 255, 255, 0.75);

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      color: #fff;

      text-decoration: none;

      font-size: 1.25rem;

      transition: all 0.3s ease;
    }

    .social-links a:hover {
      background: #fff;

      color: #000;

      transform: translateY(-4px);
    }

    /* =====================================================
       MOBILE RESPONSIVE
    ===================================================== */

    @media (max-width: 991px) {

      .navbar {
        padding: 15px 0;
      }

      .nav-link {
        margin-left: 0;

        padding: 10px 0 !important;
      }

    }

    @media (max-width: 768px) {

      .hero {
        min-height: 100vh;

        align-items: center;
      }

      .hero-content {
        margin-left: 6%;
        margin-right: 6%;

        max-width: 100%;

        text-align: center;

        padding-top: 70px;
      }

      .hello {
        font-size: 1.15rem;
      }

      .hero-title {
        font-size: 3.5rem;

        letter-spacing: -1px;

        word-break: break-word;
      }

      .hero-subtitle {
        font-size: 1.15rem;

        margin-bottom: 30px;
      }

      .btn-custom {
        margin: 5px;

        padding: 11px 22px;
      }

      .social-links {
        justify-content: center;

        margin-top: 25px;
      }

    }

    @media (max-width: 480px) {

      .hero-title {
        font-size: 2.8rem;
      }

      .hero-subtitle {
        font-size: 1rem;
      }

      .btn-custom {
        font-size: 0.85rem;
      }

    }

  </style>

</head>


<body>

          <li class="nav-item">

            </a>

          </li>


        </ul>

      </div>

    </div>

  </nav>

  <!-- =====================================================
